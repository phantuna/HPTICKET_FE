server {
    listen 80;
    server_name localhost;

    # Kích thước upload tối đa (hỗ trợ upload logo, sao lưu, file lớn)
    client_max_body_size 50M;

    # 1. Phục vụ giao diện Web SPA React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Hỗ trợ React Router DOM (Single Page Application)
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy toàn bộ API sang Backend Spring Boot container
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Cấu hình timeout cho các API nặng (xuất báo cáo, backup, đồng bộ vé)
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
